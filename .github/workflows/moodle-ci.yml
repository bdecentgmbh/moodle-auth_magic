name: Moodle plugin CI

# One run per Moodle version. The newest runs first; the others only run once it passes.

on: [pull_request]

jobs:
  canary:
    name: Moodle 5.3 / PHP 8.4 / PostgreSQL
    uses: ./.github/workflows/moodle-plugin-ci.yml
    with:
      moodle-branch: MOODLE_503_STABLE
      php: '8.4'
      database: pgsql

  matrix:
    name: Moodle ${{ matrix.label }}
    needs: canary
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: '5.2 / PHP 8.4 / MariaDB', moodle-branch: MOODLE_502_STABLE, php: '8.4', database: mariadb}
          - {label: '5.1 / PHP 8.3 / PostgreSQL', moodle-branch: MOODLE_501_STABLE, php: '8.3', database: pgsql}
          - {label: '4.5 / PHP 8.1 / PostgreSQL', moodle-branch: MOODLE_405_STABLE, php: '8.1', database: pgsql}
    uses: ./.github/workflows/moodle-plugin-ci.yml
    with:
      moodle-branch: ${{ matrix.moodle-branch }}
      php: ${{ matrix.php }}
      database: ${{ matrix.database }}
